services:
  arcane-agent:
    image: ghcr.io/getarcaneapp/agent:latest
    container_name: arcane-agent
    restart: unless-stopped
    environment:
      - ARCANE_AGENT=true
      - ARCANE_AGENT_TRANSPORT=auto
      - ARCANE_AGENT_TOKEN=${AGENT_TOKEN}
      - ARCANE_MANAGER_API_URL=http://olympus:3552
      - TZ=America/Chicago
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane-data:/app/data
      # Optional host project mount:
      - /home/danny/dotfiles/containers:/app/data/projects

volumes:
  arcane-data:
