# Catppuccin-Mocha
include current-theme.conf

font_family      family='JetBrains Mono' postscript_name=JetBrainsMono-Regular
bold_font        family='JetBrains Mono' postscript_name=JetBrainsMono-Bold
italic_font      family='JetBrains Mono' postscript_name=JetBrainsMono-Italic
bold_italic_font family='JetBrains Mono' postscript_name=JetBrainsMono-Italic

symbol_map U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

font_size 12

# modify_font cell_height -2px

# minimum foreground to background contrast ratio (0–21)
# text_fg_override_threshold 0

# using "none" makes the cursor background the inverse of the text (keep after loading theme)
cursor none

# disable cursor blinking
cursor_blink_interval 0

# time (ms) after which to enable the cursor trail (0 for off)
cursor_trail 20

# fastest and shortest decay time for cursor trail
cursor_trail_decay 0.1 0.4

# minimum distance for cursor trail to show
cursor_trail_start_threshold 2

scrollbar_track_hover_opacity 0.01

# progress bar position (top, bottom, left, right, hidden)
# progress_bar top

# hide cursor on typing
mouse_hide_wait -1

#: The color and style for highlighting URLs on mouse-over. url_style
#: can be one of: none, straight, double, curly, dotted, dashed.
# url_color #0087bd
# url_style curly

#: The set of URL prefixes to look for when detecting a URL under the
#: mouse cursor.
# url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh


#: A comma separated list of actions to take when pasting or dropping
#: text into the terminal. The supported paste actions are:
#: quote-urls-at-prompt:
#:     If the text being pasted is a URL and the cursor is at a shell prompt,
#:     automatically quote the URL (needs shell_integration).
#: replace-dangerous-control-codes
#:     Replace dangerous control codes from pasted text, without confirmation.
#: replace-newline
#:     Replace the newline character from pasted text, without confirmation.
#: confirm:
#:     Confirm the paste if the text to be pasted contains any terminal control codes
#:     as this can be dangerous, leading to code execution if the shell/program running
#:     in the terminal does not properly handle these.
#: confirm-if-large
#:     Confirm the paste if it is very large (larger than 16KB) as pasting
#:     large amounts of text into shells can be very slow.
#: filter:
#:     Run the filter_paste() function from the file paste-actions.py in
#:     the kitty config directory on the pasted text. The text returned by the
#:     function will be actually pasted.
#: no-op:
#:     Has no effect.
# paste_actions quote-urls-at-prompt,confirm


#: Characters considered part of a word when double clicking. In
#: addition to these characters any character that is marked as an
#: alphanumeric character in the Unicode database will be matched.
# select_by_word_characters @-./_~?&=%+#


#: The audio bell. Useful to disable it in environments that require
#: silence.
enable_audio_bell no


#: Some text or a Unicode symbol to show on the tab if a window in the
#: tab that does not have focus has a bell. If you want to use leading
#: or trailing spaces, surround the text with quotes. See
#: tab_title_template for how this is rendered.
#: For backwards compatibility, values of yes, y and true are
#: converted to the default bell symbol and no, n, false and none are
#: converted to the empty string.
# bell_on_tab "🔔 "

#: If enabled, the OS Window size will be remembered so that new
#: instances of kitty will have the same size as the previous
#: instance. If disabled, the OS Window will initially have size
#: configured by initial_window_width/height, in pixels. You can use a
#: suffix of "c" on the width/height values to have them interpreted
#: as number of cells instead of pixels.
# remember_window_size  yes
# initial_window_width  640
# initial_window_height 400

# disable quit confirmation
confirm_os_window_close 0


#: The edge to show the tab bar on, top or bottom.
tab_bar_edge top

# tab bar style override
active_tab_background   #74c7ec
inactive_tab_background #1e1e2e
tab_bar_background none

background_opacity 0.75

background_blur 1

selection_foreground none
selection_background none

shell fish

#: The interval to periodically check if an update to kitty is
#: available (in hours). If an update is found, a system notification
#: is displayed informing you of the available update. The default is
#: to check every 24 hours, set to zero to disable. Update checking is
#: only done by the official binary builds. Distro packages or source
#: builds do not do update checking. Changing this option by reloading
#: the config is not supported.
# update_check_interval 24

#: Special modifier key alias for default shortcuts. You can change
#: the value of this option to alter all default shortcuts that use
#: kitty_mod.
# kitty_mod ctrl+shift

map shift+alt+k remote_control scroll-window 0.5p-
map shift+alt+j remote_control scroll-window 0.5p

map shift+alt+, scroll_to_prompt -1
map shift+alt+. scroll_to_prompt 1

scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

#: Browse scrollback buffer in pager
map --allow-fallback=shifted,ascii kitty_mod+p show_scrollback

enabled_layouts splits:equalize_on_close=true

map alt+v launch --location=vsplit
map alt+s launch --location=hsplit

map shift+alt+h previous_tab
map shift+alt+l next_tab

map kitty_mod+h neighboring_window left
map kitty_mod+j neighboring_window down
map kitty_mod+k neighboring_window up
map kitty_mod+l neighboring_window right

map control+shift+alt+h move_window left
map control+shift+alt+j move_window down
map control+shift+alt+k move_window up
map control+shift+alt+l move_window right

map --allow-fallback=shifted,ascii kitty_mod+Space>h kitten hints --type hash --program @
map --allow-fallback=shifted,ascii kitty_mod+Space>p kitten hints --type path --program @
map --allow-fallback=shifted,ascii kitty_mod+Space>u kitten hints --type url --program @
map --allow-fallback=shifted,ascii kitty_mod+Space>w kitten hints --type word --program @
map --allow-fallback=shifted,ascii kitty_mod+Space>l kitten hints --type line --program @

map --allow-fallback=shifted,ascii kitty_mod+x kitten hints --type path
map --allow-fallback=shifted,ascii kitty_mod+o open_url_with_hints


map kitty_mod+f search_scrollback

map kitty_mod+/ command_palette

map --allow-fallback=shifted,ascii kitty_mod+e kitten unicode_input

map kitty_mod+l combine | clear_terminal to_cursor active | clear_terminal scrollback active
