"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_mocha"

add_newline = true

format = "$directory $character"
right_format = "$cmd_duration $git_branch $git_status"

[directory]
format            = "[$path](bold sapphire)[$read_only]($read_only_style)"
read_only = ""
read_only_style = "bold red"
truncation_length = 3
truncate_to_repo  = true
truncation_symbol = "…/"
repo_root_style = "bold sapphire"
before_repo_root_style = ""
# fish_style_pwd_dir_length = 2

[git_branch]
symbol = ""
format = "[$symbol $branch](bold mauve)"

[git_status]
format     = "($ahead_behind$staged$modified$untracked$deleted$conflicted)"
ahead      = "[⇡$count ](bold blue)"
behind     = "[⇣$count ](bold blue)"
diverged   = "[⇡$ahead_count⇣$behind_count ](bold blue)"
staged     = "[+$count ](bold green)"
modified   = "[●$count ](bold yellow)"
untracked  = "[?$count ](bold white)"
deleted    = "[✘$count ](bold red)"
conflicted = "[⚡$count ](bold red)"

[character]
success_symbol = "[⬗](text)"
error_symbol   = "[⯁](red)"
vimcmd_symbol  = "[🞛](green)"

[cmd_duration]
format = '[$duration](italic text)'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
